<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Divorce</title>
  <!--
    GitHub Pages serves this file for any unknown path under the project
    site (e.g. /divorce/some-bad-link). The app has no client-side routing,
    so the correct behavior is to send the visitor back to the app root.
    A meta refresh (no-JS friendly) plus a JS fallback handles both cases.
  -->
  <meta http-equiv="refresh" content="0; url=/divorce/" />
  <script>location.replace('/divorce/');</script>
</head>
<body style="background:#050508;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
  <p>Page not found. Redirecting to <a style="color:#fff" href="/divorce/">the Divorce app</a>&hellip;</p>
</body>
</html>
