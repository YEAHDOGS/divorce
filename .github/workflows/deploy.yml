name: Deploy to GitHub Pages

# Builds the app and publishes ./dist to the repo's GitHub Pages site:
# https://yeahdogs.github.io/divorce/
#
# One-time repo setup required before this can go live:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. Repo must be PUBLIC on the free plan (GitHub Pages does not serve
#      private repos on free plans) — or upgrade the plan.
#
# Pushing this file itself needs a token with the `workflow` scope.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Least-privilege permissions for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run --if-present

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
